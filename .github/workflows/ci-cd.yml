# Cooking.com demo – CI/CD pipeline
#
#  Pull request ──► test
#  Merge to main ─► test ─► deploy to TEST ─► verify TEST ─► [approval] ─► deploy to PRODUCTION ─► verify PRODUCTION
#
# The approval step is enforced by the GitHub environment "production" (required reviewer).
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Standard test scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests (desktop + mobile)
        run: npx playwright test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy-test:
    name: Deploy to TEST
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://cooking-test.vanwieringen.org
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build.sh
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR }}

  verify-test:
    name: Verify TEST
    needs: deploy-test
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://cooking-test.vanwieringen.org
    steps:
      - uses: actions/checkout@v4
      - name: Check that the new version is live
        run: |
          expected=$(grep -oP "APP_VERSION = '\K[^']+" assets/js/config.js)
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$BASE_URL/assets/js/config.js?run=$GITHUB_RUN_ID-$i" | grep -q "APP_VERSION = '$expected'"; then echo "Version $expected is live on TEST"; exit 0; fi
            echo "Waiting for version $expected ..."; sleep 10
          done
          echo "::error::Version $expected not found on $BASE_URL"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run all test scenarios against TEST
        run: npx playwright test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-test-environment
          path: playwright-report/
          retention-days: 14

  deploy-production:
    name: Deploy to PRODUCTION
    needs: verify-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cooking-prod.vanwieringen.org
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build.sh
      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR }}

  verify-production:
    name: Verify PRODUCTION
    needs: deploy-production
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://cooking-prod.vanwieringen.org
    steps:
      - uses: actions/checkout@v4
      - name: Check that the new version is live
        run: |
          expected=$(grep -oP "APP_VERSION = '\K[^']+" assets/js/config.js)
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$BASE_URL/assets/js/config.js?run=$GITHUB_RUN_ID-$i" | grep -q "APP_VERSION = '$expected'"; then echo "Version $expected is live on PRODUCTION"; exit 0; fi
            echo "Waiting for version $expected ..."; sleep 10
          done
          echo "::error::Version $expected not found on $BASE_URL"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke test PRODUCTION
        run: npx playwright test tests/e2e/01-smoke.spec.js
